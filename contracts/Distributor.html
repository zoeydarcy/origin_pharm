<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Origin Pharm (Distributor)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #F0F4F8;
            color: #1A2E44;
            min-height: 100vh;
        }

        header {
            background-color: #0B2D6E;
            color: white;
            padding: 18px 24px;
            text-align: center;
        }

        header h1 { font-size: 22px; font-weight: 600; }
        header p  { font-size: 13px; color: #A8C4E0; margin-top: 4px; }

        .btn-back {
            position: absolute;
            left: 24px;
            top: 50%;
            transform: translateY(-50%);
            display: inline-block;
            padding: 6px 14px;
            background: rgba(255,255,255,0.12);
            color: #ffffff;
            font-size: 12px;
            font-weight: 600;
            font-family: 'Segoe UI', Arial, sans-serif;
            text-decoration: none;
            border-radius: 5px;
            border: 1px solid rgba(255,255,255,0.25);
            letter-spacing: 0.3px;
        }

        .container {
            max-width: 720px;
            margin: 36px auto;
            padding: 0 20px 60px;
        }

        .section-label {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            color: #6B82A0;
            margin: 28px 0 10px;
        }

        .card {
            background: #FFFFFF;
            border: 1px solid #D6E0EF;
            border-radius: 8px;
            padding: 20px 22px;
            margin-bottom: 12px;
        }

        .card h3 {
            font-size: 14px;
            font-weight: 600;
            color: #0B2D6E;
            margin-bottom: 14px;
            padding-bottom: 10px;
            border-bottom: 1px solid #EAF0F8;
        }

        .info-note {
            background: #EBF2FF;
            border: 1px solid #D6E0EF;
            border-radius: 5px;
            padding: 12px 14px;
            font-size: 13px;
            color: #1553B6;
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            color: #6B82A0;
            margin-bottom: 4px;
            margin-top: 10px;
        }

        input[type="text"],
        input[type="number"],
        textarea {
            width: 100%;
            padding: 9px 11px;
            border: 1px solid #D6E0EF;
            border-radius: 5px;
            font-size: 13px;
            font-family: inherit;
            background: #F8FAFD;
            color: #1A2E44;
        }

        textarea { resize: vertical; min-height: 64px; }

        input:focus, textarea:focus {
            outline: none;
            border-color: #2E6EE1;
            background: #fff;
        }

        button {
            margin-top: 12px;
            padding: 9px 20px;
            background-color: #1553B6;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 13px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            width: 100%;
        }

        button:hover { background-color: #2E6EE1; }

        #productDetails { margin-top: 12px; font-size: 13px; color: #6B82A0; }
    </style>
</head>

<body>

    <header style="position: relative;"">
        <a href="index.html" class="btn-back">← Back to Home</a>
        <h1>Origin Pharm</h1>
        <p>Distributor Portal</p>
    </header>


        <div class="info-note">
            The Batch ID is provided on the packing slip accompanying the physical batch from the manufacturer. Enter it below to log the shipment on-chain.
        </div>

        <div class="container">
        
        <div class="section-label">Record Shipment</div>
        <div class="card">
            <h3>Ship Batch to Pharmacy</h3>
            <label for="batchId">Batch ID</label>
            <input type="number" id="batchId" placeholder="e.g. 1">
            <label for="pharmacyAddress">Pharmacy Wallet Address</label>
            <input type="text" id="pharmacyAddress" placeholder="0x...">
            <label for="notes">Shipment Notes (optional)</label>
            <textarea id="notes" placeholder="e.g. AusPost Ref: AUS-993, Temp: 2-8°C"></textarea>
            <button onclick="recordShipment()">Record Shipment</button>
            <div id="productDetails"></div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/web3@1.3.6/dist/web3.min.js"></script>

    <script>
        var web3;

        if (typeof window.ethereum !== 'undefined') {
            web3 = new Web3(window.ethereum);
            window.ethereum.enable()
                .then(function (accounts) {
                    web3.eth.defaultAccount = accounts[0];
                    console.log("Default account set:", web3.eth.defaultAccount);
                    web3.eth.getAccounts()
                        .then(function (accounts) { console.log(accounts); })
                        .catch(function (error) { console.error(error); });
                })
                .catch(function (error) { console.error(error); });
        } else if (typeof window.web3 !== 'undefined') {
            web3 = new Web3(window.web3.currentProvider);
        } else {
            console.log('Non-Ethereum browser detected. Please install MetaMask.');
        }

        // ── UPDATE THIS ADDRESS AFTER REMIX DEPLOYMENT ──────────────────────
        const controlContractAddress = 'PASTE_CONTROL_CONTRACT_ADDRESS_HERE';

        const controlContractABI = [
            {"inputs":[{"internalType":"uint256","name":"batchId","type":"uint256"},{"internalType":"address","name":"pharmacy","type":"address"},{"internalType":"string","name":"notes","type":"string"}],"name":"shipment","outputs":[],"stateMutability":"nonpayable","type":"function"}
        ];

        const controlContract = new web3.eth.Contract(controlContractABI, controlContractAddress);

        async function recordShipment() {
            const batchId         = document.getElementById('batchId').value;
            const pharmacyAddress = document.getElementById('pharmacyAddress').value;
            const notes           = document.getElementById('notes').value;

            await controlContract.methods.shipment(batchId, pharmacyAddress, notes)
                .send({ from: web3.eth.defaultAccount })
                .on('transactionHash', function(hash) {
                    console.log('Transaction Hash:', hash);
                })
                .on('confirmation', function(confirmationNumber, receipt) {
                    console.log('Confirmation Number:', confirmationNumber);
                    console.log('Receipt:', receipt);
                })
                .catch(function(error) { console.error('Error recording shipment:', error); });

            document.getElementById('productDetails').textContent = 'Batch ' + batchId + ' shipment recorded. Status → InTransit.';
        }
    </script>

</body>
</html>
