<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Origin Pharm (Pharmacy)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #F0F4F8;
            color: #1A2E44;
            min-height: 100vh;
        }

        header {
            background-color: #0B2D6E;
            color: white;
            padding: 18px 24px;
            text-align: center;
        }

        header h1 {
            font-size: 22px;
            font-weight: 600;
        }

        header p {
            font-size: 13px;
            color: #A8C4E0;
            margin-top: 4px;
        }
        
        .error-msg {
            display: none;
            margin-top: 8px;
            padding: 8px 12px;
            background: #FDECEA;
            border: 1px solid #F7C1C1;
            border-radius: 5px;
            font-size: 12px;
            color: #C0392B;
        }

        .success-msg {
            display: none;
            margin-top: 8px;
            padding: 8px 12px;
            background: #E6F5EE;
            border: 1px solid #C0DD97;
            border-radius: 5px;
            font-size: 12px;
            color: #0A7A4C;
        }

        .btn-back {
            position: absolute;
            left: 24px;
            top: 50%;
            transform: translateY(-50%);
            display: inline-block;
            padding: 6px 14px;
            background: rgba(255,255,255,0.12);
            color: #ffffff;
            font-size: 12px;
            font-weight: 600;
            font-family: 'Segoe UI', Arial, sans-serif;
            text-decoration: none;
            border-radius: 5px;
            border: 1px solid rgba(255,255,255,0.25);
            letter-spacing: 0.3px;
        }
        

        .container {
            max-width: 720px;
            margin: 36px auto;
            padding: 0 20px 60px;
        }

        .section-label {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            color: #6B82A0;
            margin: 28px 0 10px;
        }



        .card {
            background: #FFFFFF;
            border: 1px solid #D6E0EF;
            border-radius: 8px;
            padding: 20px 22px;
            margin-bottom: 12px;
        }

        .card h3 {
            font-size: 14px;
            font-weight: 600;
            color: #0B2D6E;
            margin-bottom: 14px;
            padding-bottom: 10px;
            border-bottom: 1px solid #EAF0F8;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            color: #6B82A0;
            margin-bottom: 4px;
            margin-top: 10px;
        }

        input[type="text"],
        input[type="number"] {
            width: 100%;
            padding: 9px 11px;
            border: 1px solid #D6E0EF;
            border-radius: 5px;
            font-size: 13px;
            font-family: inherit;
            background: #F8FAFD;
            color: #1A2E44;
        }

        input:focus {
            outline: none;
            border-color: #2E6EE1;
            background: #fff;
        }

        button {
            margin-top: 12px;
            padding: 9px 20px;
            background-color: #1553B6;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 13px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            width: 100%;
        }

        button:hover {
            background-color: #2E6EE1;
        }

        button.confirm {
            background-color: #0A7A4C;
        }

        button.confirm:hover {
            background-color: #076040;
        }

        button.print-btn {
            background-color: #0B2D6E;
            margin-top: 10px;
        }

        button.print-btn:hover {
            background-color: #1553B6;
        }

        /* Batch status result */
        #batchStatusResult {
            display: none;
            margin-top: 14px;
            padding: 16px;
            background: #F8FAFD;
            border: 1px solid #D6E0EF;
            border-radius: 6px;
        }

        #batchStatusResult p {
            font-size: 13px;
            color: #1A2E44;
            margin-bottom: 6px;
        }

        #batchStatusResult p strong {
            color: #0B2D6E;
        }

        .verified-yes {
            display: inline-block;
            background: #E6F5EE;
            color: #0A7A4C;
            border-radius: 12px;
            padding: 2px 10px;
            font-size: 12px;
            font-weight: 700;
        }

        .verified-no {
            display: inline-block;
            background: #FEF3C7;
            color: #B45309;
            border-radius: 12px;
            padding: 2px 10px;
            font-size: 12px;
            font-weight: 700;
        }

        /* QR section */
        #qrSection {
            display: none;
            margin-top: 14px;
            padding: 20px;
            background: #F8FAFD;
            border: 1px dashed #D6E0EF;
            border-radius: 6px;
            text-align: center;
        }

        #qrSection p {
            font-size: 13px;
            color: #1553B6;
            font-weight: 600;
            margin-bottom: 12px;
        }

        #qrCode {
            margin: 0 auto 12px;
            display: inline-block;
        }

        #productDetails {
            margin-top: 12px;
            font-size: 13px;
            color: #6B82A0;
        }

        .trail-item {
            background: #EBF2FF;
            border-radius: 5px;
            padding: 8px 10px;
            margin-bottom: 6px;
            font-size: 12px;
            color: #1A2E44;
        }
    </style>

    <header style="position: relative;">
    <a href="index.html" class="btn-back">← Back to Home</a>

        <h1>Origin Pharm</h1>
        <p>Pharmacy Portal</p>
    </header>

    <div class="container">

        <!-- STEP 1: SEARCH BATCH -->
        <div class="section-label">Step 1 — Search Batch</div>
        <div class="card">
            <h3>Search Batch</h3>
            <label for="searchBatchId">Batch ID</label>
            <input type="number" id="searchBatchId" placeholder="Enter Batch ID from packing slip">
            <button onclick="searchBatch()">Search Batch</button>
            <div id="batchStatusResult"></div>
        </div>

        <!-- STEP 2: CONFIRM RECEIPT -->
        <div class="section-label">Step 2 — Confirm Receipt</div>
        <div class="card">
            <h3>Receipt</h3>
            <label for="receiptBatchId">Batch ID</label>
            <input type="number" id="receiptBatchId" placeholder="e.g. 1">
            <button class="confirm" onclick="confirmReceipt()">Receipt Batch</button>
            <div id="receiptError"   class="error-msg"></div>
            <div id="receiptSuccess" class="success-msg"></div>
            <div id="productDetails"></div>
            <div id="qrSection">
                <p>✓ Cycle Complete — QR Code Ready to Print</p>
                <div id="qrCode"></div>
                <button class="print-btn" onclick="printQR()">🖨 Print QR Code</button>
            </div>
        </div>

    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

        var web3;
        var currentBatchId = null;

        if (typeof window.ethereum !== 'undefined') {
            web3 = new Web3(window.ethereum);
            window.ethereum.enable()
                .then(function (accounts) {
                    web3.eth.defaultAccount = accounts[0];
                    console.log("Default account set:", web3.eth.defaultAccount);
                })
                .catch(function (error) { console.error(error); });
        } else if (typeof window.web3 !== 'undefined') {
            web3 = new Web3(window.web3.currentProvider);

            console.log('Non-Ethereum browser detected. Please install MetaMask.');

        // ── UPDATE THESE ADDRESSES AFTER REMIX DEPLOYMENT ──────────────────
        const controlContractAddress      = 'PASTE_CONTROL_CONTRACT_ADDRESS_HERE';
        const verificationContractAddress = 'PASTE_VERIFICATION_CONTRACT_ADDRESS_HERE';
        const mintContractAddress         = 'PASTE_MINT_CONTRACT_ADDRESS_HERE';

        const controlContractABI = [
            { "inputs": [{ "internalType": "uint256", "name": "batchId", "type": "uint256" }], "name": "receipt", "outputs": [], "stateMutability": "nonpayable", "type": "function" },
            { "inputs": [{ "internalType": "address", "name": "", "type": "address" }], "name": "authorisedDistributors", "outputs": [{ "internalType": "bool", "name": "isAuthorised", "type": "bool" }, { "internalType": "string", "name": "name", "type": "string" }], "stateMutability": "view", "type": "function" },
            { "inputs": [{ "internalType": "address", "name": "", "type": "address" }], "name": "authorisedPharmacies", "outputs": [{ "internalType": "bool", "name": "isAuthorised", "type": "bool" }, { "internalType": "string", "name": "name", "type": "string" }], "stateMutability": "view", "type": "function" }
        ];

        const verificationContractABI = [
            { "inputs": [{ "internalType": "uint256", "name": "batchId", "type": "uint256" }], "name": "batchStatus", "outputs": [{ "internalType": "string", "name": "medicineName", "type": "string" }, { "internalType": "string", "name": "batchNumber", "type": "string" }, { "internalType": "string", "name": "manufacturerName", "type": "string" }, { "internalType": "address", "name": "manufacturer", "type": "address" }, { "internalType": "uint256", "name": "manufactureDate", "type": "uint256" }, { "internalType": "uint256", "name": "expiryDate", "type": "uint256" }, { "internalType": "string", "name": "status", "type": "string" }, { "internalType": "bool", "name": "verified", "type": "bool" }, { "internalType": "address", "name": "currentOwner", "type": "address" }, { "components": [{ "internalType": "address", "name": "from", "type": "address" }, { "internalType": "address", "name": "to", "type": "address" }, { "internalType": "uint8", "name": "status", "type": "uint8" }, { "internalType": "uint256", "name": "timestamp", "type": "uint256" }, { "internalType": "string", "name": "notes", "type": "string" }], "internalType": "struct CustodyRecord[]", "name": "custodyTrail", "type": "tuple[]" }], "stateMutability": "view", "type": "function" }
        ];

        const mintContractABI = [
            { "inputs": [{ "internalType": "address", "name": "", "type": "address" }], "name": "authorisedManufacturers", "outputs": [{ "internalType": "bool", "name": "isAuthorised", "type": "bool" }, { "internalType": "string", "name": "name", "type": "string" }], "stateMutability": "view", "type": "function" }
        ];

        const mintContract         = new web3.eth.Contract(mintContractABI,         mintContractAddress);
        const controlContract      = new web3.eth.Contract(controlContractABI,      controlContractAddress);
        const verificationContract = new web3.eth.Contract(verificationContractABI, verificationContractAddress);

        const statusLabels = ['Produced', 'Released', 'InTransit', 'Received'];

        // ── Error helpers ────────────────────────────────────────────────────
        function parseContractError(error) {
            const msg = error?.message || '';
            const match = msg.match(/reason string '(.+?)'/i)
                    || msg.match(/"message":"(.+?)"/i)
                    || msg.match(/reverted with reason string "(.+?)"/i);
            if (match) return match[1];
            if (msg.includes('User denied')) return 'Transaction cancelled by user.';
            return 'Transaction failed. Check your role and inputs.';
        }

        function showError(id, message) {
            const el = document.getElementById(id);
            el.textContent = message;
            el.style.display = 'block';
            document.getElementById(id.replace('Error', 'Success')).style.display = 'none';
        }

        function showSuccess(id, message) {
            const el = document.getElementById(id);
            el.textContent = message;
            el.style.display = 'block';
            document.getElementById(id.replace('Success', 'Error')).style.display = 'none';
        }
        // ── End error helpers ─────────────────────────────────────────────────




        async function resolvePartyName(address) {
            const ZERO = '0x0000000000000000000000000000000000000000';
            if (!address || address === ZERO) return 'Origin Pharm (System)';

            try {
                const mfr = await mintContract.methods.authorisedManufacturers(address).call();
                if (mfr && mfr.name && mfr.name.length > 0) return mfr.name;
            } catch(e) {}

            try {
                const dist = await controlContract.methods.authorisedDistributors(address).call();
                if (dist && dist.name && dist.name.length > 0) return dist.name;
            } catch(e) {}

            try {
                const ph = await controlContract.methods.authorisedPharmacies(address).call();
                if (ph && ph.name && ph.name.length > 0) return ph.name;
            } catch(e) {}

            return 'Unknown';
        }



        async function searchBatch() {
            const batchId   = document.getElementById('searchBatchId').value.trim();
            const resultDiv = document.getElementById('batchStatusResult');

            if (!batchId || isNaN(batchId) || Number(batchId) <= 0) {
                resultDiv.style.display = 'block';
                resultDiv.innerHTML = '<p style="color:#C0392B;">Invalid input — please enter a valid Batch ID.</p>';
                return;
            }

            currentBatchId = batchId;
            document.getElementById('receiptBatchId').value = batchId;

            try {
                const result = await verificationContract.methods.batchStatus(batchId).call();

                const medicineName     = result[0];
                const batchNumber      = result[1];
                const manufacturerName = result[2];
                const manufactureDate  = new Date(result[4] * 1000).toLocaleDateString('en-AU');
                const expiryDate       = new Date(result[5] * 1000).toLocaleDateString('en-AU');
                const status           = result[6];
                const verified         = result[7];
                const currentOwner     = result[8];
                const custodyTrail     = result[9];

                const currentOwnerName = await resolvePartyName(currentOwner);

                const verifiedBadge = verified
                    ? '<span class="verified-yes">✓ Verified</span>'
                    : '<span class="verified-no">⏳ Not Yet Verified</span>';

                let trailHTML = '';
                for (let i = 0; i < custodyTrail.length; i++) {
                    const rec       = custodyTrail[i];
                    const recStatus = statusLabels[rec.status] || rec.status;
                    const ts        = new Date(rec.timestamp * 1000).toLocaleDateString('en-AU');
                    const fromName  = await resolvePartyName(rec.from);
                    const toName    = await resolvePartyName(rec.to);
                    trailHTML += `<div class="trail-item">
                        <strong>${i + 1}. ${recStatus}</strong>
                        &nbsp;·&nbsp; ${fromName} → ${toName}
                        &nbsp;·&nbsp; ${ts}
                        ${rec.notes ? ' · ' + rec.notes : ''}
                    </div>`;
                }

                resultDiv.style.display = 'block';
                resultDiv.innerHTML = `
                    <p><strong>Medicine:</strong> ${medicineName}</p>
                    <p><strong>Batch Reference:</strong> ${batchNumber}</p>
                    <p><strong>Manufacturer:</strong> ${manufacturerName}</p>
                    <p><strong>Manufacture Date:</strong> ${manufactureDate}</p>
                    <p><strong>Expiry Date:</strong> ${expiryDate}</p>
                    <p><strong>Status:</strong> ${status}</p>
                    <p><strong>Verified:</strong> ${verifiedBadge}</p>
                    <p><strong>Current Custodian:</strong> ${currentOwnerName}</p>
                    <p style="margin-top:10px;margin-bottom:6px;font-weight:600;font-size:12px;
                            color:#6B82A0;text-transform:uppercase;letter-spacing:0.8px;">Custody Trail</p>
                    ${trailHTML || '<div class="trail-item">No transfers recorded yet.</div>'}
                `;
            } catch(error) {
                resultDiv.style.display = 'block';
                resultDiv.innerHTML = '<p style="color:#C0392B;">Batch ID not found. Please check the ID and try again.</p>';
                console.error(error);
            }
        }

        async function confirmReceipt() {
            const batchId = document.getElementById('receiptBatchId').value.trim();

            if (!batchId || isNaN(batchId) || Number(batchId) <= 0) {
                showError('receiptError', 'Invalid input — please enter a valid Batch ID.');
                return;
            }

            try {
                await controlContract.methods.receipt(batchId)
                    .send({ from: web3.eth.defaultAccount })
                    .on('transactionHash', function(hash) { console.log('Transaction Hash:', hash); });
                showSuccess('receiptSuccess', 'Batch ' + batchId + ' received. Status → Received.');
                document.getElementById('productDetails').textContent = '';
                generateQR(batchId);
            } catch(error) {
                showError('receiptError', parseContractError(error));
            }
        }

        function generateQR(batchId) {
            var qrDiv = document.getElementById('qrCode');
            qrDiv.innerHTML = '';
            new QRCode(qrDiv, {
                text: 'originpharm://batch/' + batchId,
                width: 160,
                height: 160,
                colorDark: '#0B2D6E',
                colorLight: '#FFFFFF',
                correctLevel: QRCode.CorrectLevel.H
            });
            document.getElementById('qrSection').style.display = 'block';
        }

        function printQR() {
            var qrDiv  = document.getElementById('qrCode');
            var canvas = qrDiv.querySelector('canvas');
            var img    = canvas ? canvas.toDataURL() : '';
            var win    = window.open('', '_blank');
            win.document.write(
                '<html><head><title>Origin Pharm QR Code</title>' +
                '<style>body{font-family:Arial,sans-serif;text-align:center;padding:40px;}h2{color:#0B2D6E;}p{color:#6B82A0;font-size:13px;margin-top:8px;}</style>' +
                '</head><body>' +
                '<h2>Origin Pharm — Verified Batch</h2>' +
                '<img src="' + img + '" width="180" height="180" />' +
                '<p>Batch ID: ' + currentBatchId + '</p>' +
                '<p>Scan to verify via Origin Pharm</p>' +
                '<script>window.print();<\/script>' +
                '</body></html>'
            );
            win.document.close();
        }
