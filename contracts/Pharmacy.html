<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Origin Pharm (Pharmacy)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #F0F4F8;
            color: #1A2E44;
            min-height: 100vh;
        }

        header {
            background-color: #0B2D6E;
            color: white;
            padding: 18px 24px;
            text-align: center;
        }

        header h1 {
            font-size: 22px;
            font-weight: 600;
        }

        header p {
            font-size: 13px;
            color: #A8C4E0;
            margin-top: 4px;
        }

        .container {
            max-width: 720px;
            margin: 36px auto;
            padding: 0 20px 60px;
        }

        .section-label {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            color: #6B82A0;
            margin: 28px 0 10px;
        }

        .card {
            background: #FFFFFF;
            border: 1px solid #D6E0EF;
            border-radius: 8px;
            padding: 20px 22px;
            margin-bottom: 12px;
        }

        .card h3 {
            font-size: 14px;
            font-weight: 600;
            color: #0B2D6E;
            margin-bottom: 14px;
            padding-bottom: 10px;
            border-bottom: 1px solid #EAF0F8;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            color: #6B82A0;
            margin-bottom: 4px;
            margin-top: 10px;
        }

        input[type="text"],
        input[type="number"] {
            width: 100%;
            padding: 9px 11px;
            border: 1px solid #D6E0EF;
            border-radius: 5px;
            font-size: 13px;
            font-family: inherit;
            background: #F8FAFD;
            color: #1A2E44;
        }

        input:focus {
            outline: none;
            border-color: #2E6EE1;
            background: #fff;
        }

        button {
            margin-top: 12px;
            padding: 9px 20px;
            background-color: #1553B6;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 13px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            width: 100%;
        }

        button:hover {
            background-color: #2E6EE1;
        }

        button.confirm {
            background-color: #0A7A4C;
        }

        button.confirm:hover {
            background-color: #076040;
        }

        button.print-btn {
            background-color: #0B2D6E;
            margin-top: 10px;
        }

        button.print-btn:hover {
            background-color: #1553B6;
        }

        /* Batch status result */
        #batchStatusResult {
            display: none;
            margin-top: 14px;
            padding: 16px;
            background: #F8FAFD;
            border: 1px solid #D6E0EF;
            border-radius: 6px;
        }

        #batchStatusResult p {
            font-size: 13px;
            color: #1A2E44;
            margin-bottom: 6px;
        }

        #batchStatusResult p strong {
            color: #0B2D6E;
        }

        .verified-yes {
            display: inline-block;
            background: #E6F5EE;
            color: #0A7A4C;
            border-radius: 12px;
            padding: 2px 10px;
            font-size: 12px;
            font-weight: 700;
        }

        .verified-no {
            display: inline-block;
            background: #FEF3C7;
            color: #B45309;
            border-radius: 12px;
            padding: 2px 10px;
            font-size: 12px;
            font-weight: 700;
        }

        /* QR section */
        #qrSection {
            display: none;
            margin-top: 14px;
            padding: 20px;
            background: #F8FAFD;
            border: 1px dashed #D6E0EF;
            border-radius: 6px;
            text-align: center;
        }

        #qrSection p {
            font-size: 13px;
            color: #1553B6;
            font-weight: 600;
            margin-bottom: 12px;
        }

        #qrCode {
            margin: 0 auto 12px;
            display: inline-block;
        }

        #productDetails {
            margin-top: 12px;
            font-size: 13px;
            color: #6B82A0;
        }

        .trail-item {
            background: #EBF2FF;
            border-radius: 5px;
            padding: 8px 10px;
            margin-bottom: 6px;
            font-size: 12px;
            color: #1A2E44;
        }
    </style>
</head>

<body>

    <header>
        <h1>Origin Pharm</h1>
        <p>Pharmacy Portal</p>
    </header>

    <div class="container">

        <!-- STEP 1: SEARCH BATCH -->
        <div class="section-label">Step 1 — Search Batch</div>
        <div class="card">
            <h3>Search Batch</h3>
            <label for="searchBatchId">Batch ID</label>
            <input type="number" id="searchBatchId" placeholder="Enter Batch ID from packing slip">
            <button onclick="searchBatch()">Search Batch</button>
            <div id="batchStatusResult"></div>
        </div>

        <!-- STEP 2: CONFIRM RECEIPT -->
        <div class="section-label">Step 2 — Confirm Receipt</div>
        <div class="card">
            <h3>Receipt</h3>
            <label for="receiptBatchId">Batch ID</label>
            <input type="number" id="receiptBatchId" placeholder="e.g. 1">
            <button class="confirm" onclick="confirmReceipt()">Receipt Batch</button>
            <div id="productDetails"></div>
            <div id="qrSection">
                <p>✓ Cycle Complete — QR Code Ready to Print</p>
                <div id="qrCode"></div>
                <button class="print-btn" onclick="printQR()">🖨 Print QR Code</button>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/web3@1.3.6/dist/web3.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <script>
        var web3;
        var currentBatchId = null;

        if (typeof window.ethereum !== 'undefined') {
            web3 = new Web3(window.ethereum);
            window.ethereum.enable()
                .then(function (accounts) {
                    web3.eth.defaultAccount = accounts[0];
                    console.log("Default account set:", web3.eth.defaultAccount);
                    web3.eth.getAccounts()
                        .then(function (accounts) { console.log(accounts); })
                        .catch(function (error) { console.error(error); });
                })
                .catch(function (error) { console.error(error); });
        } else if (typeof window.web3 !== 'undefined') {
            web3 = new Web3(window.web3.currentProvider);
        } else {
            console.log('Non-Ethereum browser detected. Please install MetaMask.');
        }

        // ── UPDATE THESE ADDRESSES AFTER REMIX DEPLOYMENT ──────────────────
        const controlContractAddress = '0x607428c19e4d6a8994DAE2c3f7E966bA4EF395e0';
        const verificationContractAddress = '0x8Bd213C236be5eC35C999a17F94804B37B83a28F';

        const controlContractABI = [
            { "inputs": [{ "internalType": "uint256", "name": "batchId", "type": "uint256" }], "name": "receipt", "outputs": [], "stateMutability": "nonpayable", "type": "function" }
        ];

        const verificationContractABI = [
            { "inputs": [{ "internalType": "uint256", "name": "batchId", "type": "uint256" }], "name": "batchStatus", "outputs": [{ "internalType": "string", "name": "medicineName", "type": "string" }, { "internalType": "string", "name": "batchNumber", "type": "string" }, { "internalType": "string", "name": "manufacturerName", "type": "string" }, { "internalType": "address", "name": "manufacturer", "type": "address" }, { "internalType": "uint256", "name": "manufactureDate", "type": "uint256" }, { "internalType": "uint256", "name": "expiryDate", "type": "uint256" }, { "internalType": "string", "name": "status", "type": "string" }, { "internalType": "bool", "name": "verified", "type": "bool" }, { "internalType": "address", "name": "currentOwner", "type": "address" }, { "components": [{ "internalType": "address", "name": "from", "type": "address" }, { "internalType": "address", "name": "to", "type": "address" }, { "internalType": "uint8", "name": "status", "type": "uint8" }, { "internalType": "uint256", "name": "timestamp", "type": "uint256" }, { "internalType": "string", "name": "notes", "type": "string" }], "internalType": "struct CustodyRecord[]", "name": "custodyTrail", "type": "tuple[]" }], "stateMutability": "view", "type": "function" }
        ];

        const controlContract = new web3.eth.Contract(controlContractABI, controlContractAddress);
        const verificationContract = new web3.eth.Contract(verificationContractABI, verificationContractAddress);

        const statusLabels = ['Produced', 'Released', 'InTransit', 'Received'];

        async function searchBatch() {
            const batchId = document.getElementById('searchBatchId').value;
            currentBatchId = batchId;
            document.getElementById('receiptBatchId').value = batchId;

            const result = await verificationContract.methods.batchStatus(batchId).call();

            const medicineName = result[0];
            const batchNumber = result[1];
            const manufacturerName = result[2];
            const manufacturer = result[3];
            const manufactureDate = new Date(result[4] * 1000).toLocaleDateString('en-AU');
            const expiryDate = new Date(result[5] * 1000).toLocaleDateString('en-AU');
            const status = result[6];
            const verified = result[7];
            const currentOwner = result[8];
            const custodyTrail = result[9];

            const verifiedBadge = verified
                ? '<span class="verified-yes">✓ Verified</span>'
                : '<span class="verified-no">⏳ Not Yet Verified</span>';

            let trailHTML = '';
            custodyTrail.forEach(function (rec, i) {
                const recStatus = statusLabels[rec.status] || rec.status;
                const ts = new Date(rec.timestamp * 1000).toLocaleDateString('en-AU');
                trailHTML += `<div class="trail-item"><strong>${i + 1}. ${recStatus}</strong> &mdash; ${rec.from.slice(0, 6)}...${rec.from.slice(-4)} → ${rec.to.slice(0, 6)}...${rec.to.slice(-4)} &nbsp;·&nbsp; ${ts}${rec.notes ? ' · ' + rec.notes : ''}</div>`;
            });

            const resultDiv = document.getElementById('batchStatusResult');
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = `
                <p><strong>Medicine:</strong> ${medicineName}</p>
                <p><strong>Batch Reference:</strong> ${batchNumber}</p>
                <p><strong>Manufacturer:</strong> ${manufacturerName}</p>
                <p><strong>Manufacturer Address:</strong> ${manufacturer}</p>
                <p><strong>Manufacture Date:</strong> ${manufactureDate}</p>
                <p><strong>Expiry Date:</strong> ${expiryDate}</p>
                <p><strong>Status:</strong> ${status}</p>
                <p><strong>Verified:</strong> ${verifiedBadge}</p>
                <p><strong>Current Custodian:</strong> ${currentOwner}</p>
                <p style="margin-top:10px;margin-bottom:6px;font-weight:600;font-size:12px;color:#6B82A0;text-transform:uppercase;letter-spacing:0.8px;">Custody Trail</p>
                ${trailHTML || '<div class="trail-item">No transfers recorded yet.</div>'}
            `;
        }

        async function confirmReceipt() {
            const batchId = document.getElementById('receiptBatchId').value;
            currentBatchId = batchId;

            try {
                // Send the transaction and wait for receipt
                const receipt = await controlContract.methods.receipt(batchId)
                    .send({
                        from: web3.eth.defaultAccount
                    })
                    .on('transactionHash', function (hash) {
                        console.log('Transaction Hash:', hash);
                        // Optional: Show loading indicator here
                    })
                    .on('confirmation', function (confirmationNumber, receipt) {
                        console.log('Confirmation Number:', confirmationNumber);
                    });

                // This code only runs if the transaction was successful
                console.log('Transaction successful! Receipt:', receipt);

                // Update UI
                document.getElementById('productDetails').textContent =
                    'Batch ' + batchId + ' received. Status → Received. verified = true.';

                // Generate QR code only on success
                generateQR(batchId);

            } catch (error) {
                console.error('Error confirming receipt:', error);
                // Optional: Show error message to user
                alert('Transaction failed. Please try again.');
            }
        }

        function generateQR(batchId) {
            var qrDiv = document.getElementById('qrCode');
            qrDiv.innerHTML = '';
            new QRCode(qrDiv, {
                text: 'originpharm://batch/' + batchId,
                width: 160,
                height: 160,
                colorDark: '#0B2D6E',
                colorLight: '#FFFFFF',
                correctLevel: QRCode.CorrectLevel.H
            });
            document.getElementById('qrSection').style.display = 'block';
        }

        function printQR() {
            var qrDiv = document.getElementById('qrCode');
            var canvas = qrDiv.querySelector('canvas');
            var img = canvas ? canvas.toDataURL() : '';
            var win = window.open('', '_blank');
            win.document.write(
                '<html><head><title>Origin Pharm QR Code</title>' +
                '<style>body{font-family:Arial,sans-serif;text-align:center;padding:40px;}h2{color:#0B2D6E;}p{color:#6B82A0;font-size:13px;margin-top:8px;}</style>' +
                '</head><body>' +
                '<h2>Origin Pharm — Verified Batch</h2>' +
                '<img src="' + img + '" width="180" height="180" />' +
                '<p>Batch ID: ' + currentBatchId + '</p>' +
                '<p>Scan to verify via Origin Pharm</p>' +
                '<script>window.print();<\/script>' +
                '</body></html>'
            );
            win.document.close();
        }
    </script>

</body>

</html>
