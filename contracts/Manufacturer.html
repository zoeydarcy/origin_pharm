            font-size: 12px;
            font-weight: 600;

            border-radius: 5px;

            letter-spacing: 0.3px;
        }
        .error-msg {
            display: none;
            margin-top: 8px;
            padding: 8px 12px;
            background: #FDECEA;
            border: 1px solid #F7C1C1;
            border-radius: 5px;
            font-size: 12px;
            color: #C0392B;
        }

        .success-msg {
            display: none;
            margin-top: 8px;
            padding: 8px 12px;
            background: #E6F5EE;
            border: 1px solid #C0DD97;
            border-radius: 5px;
            font-size: 12px;
            color: #0A7A4C;
        }
        .container {
            max-width: 720px;
            margin: 36px auto;
            padding: 0 20px 60px;
        }

        .section-label {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            color: #6B82A0;
            margin: 28px 0 10px;
        }

            background: #FFFFFF;

            border-radius: 8px;
            padding: 20px 22px;
            margin-bottom: 12px;
        }

        .card h3 {
            font-size: 14px;
            font-weight: 600;
            color: #0B2D6E;
            margin-bottom: 14px;
            padding-bottom: 10px;
            border-bottom: 1px solid #EAF0F8;
        }

            display: block;
            font-size: 12px;
            font-weight: 500;
            color: #6B82A0;
            margin-bottom: 4px;
            margin-top: 10px;
        }

            border-radius: 5px;
            font-size: 13px;
            font-family: inherit;
            background: #F8FAFD;
            color: #1A2E44;
        }

        input:focus {

            border-color: #2E6EE1;
            background: #fff;
        }

            background-color: #1553B6;
            color: white;
            border: none;
            border-radius: 5px;

            font-weight: 600;

            <p class="hint">A unique Batch ID will be assigned on-chain when the batch is created</p>
            <div id="mintError"   class="error-msg"></div>
            <div id="mintSuccess" class="success-msg"></div>
            <div id="batchIdResult"></div>
        </div>

            <div id="releaseSuccess" class="success-msg"></div>
            <div id="productDetails"></div>
        </div>

                    },
                    {
                        "internalType": "string",
                        "name": "notes",
                        "type": "string"
                    }
                ],
                "name": "shipment",
                "outputs": [],
                "stateMutability": "nonpayable",
                "type": "function"
            }
        ];

        const mintContract = new web3.eth.Contract(mintContractABI,    mintContractAddress);
        const controlContract = new web3.eth.Contract(controlContractABI, controlContractAddress);

// ERROR/FEEDBACK-LOOP HELPERS
        function parseContractError(error) {
            const msg = error?.message || '';
            const match = msg.match(/reason string '(.+?)'/i)
                    || msg.match(/"message":"(.+?)"/i)
                    || msg.match(/reverted with reason string "(.+?)"/i);
            if (match) return match[1];
            if (msg.includes('User denied')) return 'Transaction cancelled by user.';
            return 'Transaction failed. Check your role and inputs.';
        }

        function showError(id, message) {
            const el = document.getElementById(id);
            el.textContent = message;
            el.style.display = 'block';
            document.getElementById(id.replace('Error', 'Success')).style.display = 'none';
        }

        function showSuccess(id, message) {
            const el = document.getElementById(id);
            el.textContent = message;
            el.style.display = 'block';
            document.getElementById(id.replace('Success', 'Error')).style.display = 'none';
        }


        async function mintBatch() {
            const medicineName = document.getElementById('medicineName').value.trim();
            const batchSize = document.getElementById('batchSize').value.trim();
            const expiryRaw = document.getElementById('expiryDate').value;

            if (!medicineName) {
                showError('mintError', 'Invalid input — please enter a medicine name.');
                return;
            }
            if (!batchSize) {
                showError('mintError', 'Invalid input — please enter a batch reference.');
                return;
            }
            if (!expiryRaw) {
                showError('mintError', 'Invalid input — please select an expiry date.');
                return;
            }
            const expiryTs = Math.floor(new Date(expiryRaw).getTime() / 1000);
            if (expiryTs <= Math.floor(Date.now() / 1000)) {
                showError('mintError', 'Invalid input — expiry date must be in the future.');
                return;
            }

            try {
                await mintContract.methods.mintBatch(medicineName, batchSize, expiryTs)
                    .send({ from: web3.eth.defaultAccount })
                    .on('transactionHash', function(hash) { console.log('Transaction Hash:', hash); })
                    .on('receipt', function(receipt) {
                        const event = receipt.events && receipt.events.BatchMinted;
                        if (event) {
                            const batchId = event.returnValues.batchId;
                            const resultDiv = document.getElementById('batchIdResult');
                            resultDiv.style.display = 'block';
                            resultDiv.textContent = 'Batch ID: ' + batchId + ' — record this and include it on the packing slip';
                            document.getElementById('releaseBatchId').value = batchId;
                            showSuccess('mintSuccess', 'Batch created successfully. Batch ID: ' + batchId);
                        }
                    });
            } catch(error) {
                showError('mintError', parseContractError(error));
            }
        }

        async function releaseBatch() {
            const batchId = document.getElementById('releaseBatchId').value.trim();
            const distributor = document.getElementById('distributorAddress').value.trim();

            if (!batchId || isNaN(batchId) || Number(batchId) <= 0) {
                showError('releaseError', 'Invalid input — please enter a valid Batch ID.');
                return;
            }
            if (!distributor || !distributor.startsWith('0x') || distributor.length !== 42) {
                showError('releaseError', 'Invalid input — please enter a valid distributor wallet address.');
                return;
            }

            try {
                await controlContract.methods.release(batchId, distributor)
                    .send({ from: web3.eth.defaultAccount })
                    .on('transactionHash', function(hash) { console.log('Transaction Hash:', hash); });
                showSuccess('releaseSuccess', 'Batch ' + batchId + ' released. Status → Released.');
                document.getElementById('productDetails').textContent = '';
            } catch(error) {
                showError('releaseError', parseContractError(error));
            }
        }

    </script>

</body>
</html>
