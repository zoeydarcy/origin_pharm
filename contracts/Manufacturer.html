<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Origin Pharm (Manufacturer)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #F0F4F8;
            color: #1A2E44;
            min-height: 100vh;
        }

        header {
            background-color: #0B2D6E;
            color: white;
            padding: 18px 24px;
            text-align: center;
        }

        header h1 { font-size: 22px; font-weight: 600; }
        header p  { font-size: 13px; color: #A8C4E0; margin-top: 4px; }

        .container {
            max-width: 720px;
            margin: 36px auto;
            padding: 0 20px 60px;
        }

        .section-label {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            color: #6B82A0;
            margin: 28px 0 10px;
        }

        .card {
            background: #FFFFFF;
            border: 1px solid #D6E0EF;
            border-radius: 8px;
            padding: 20px 22px;
            margin-bottom: 12px;
        }

        .card h3 {
            font-size: 14px;
            font-weight: 600;
            color: #0B2D6E;
            margin-bottom: 14px;
            padding-bottom: 10px;
            border-bottom: 1px solid #EAF0F8;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            color: #6B82A0;
            margin-bottom: 4px;
            margin-top: 10px;
        }

        input[type="text"],
        input[type="number"],
        input[type="date"] {
            width: 100%;
            padding: 9px 11px;
            border: 1px solid #D6E0EF;
            border-radius: 5px;
            font-size: 13px;
            font-family: inherit;
            background: #F8FAFD;
            color: #1A2E44;
        }

        input:focus {
            outline: none;
            border-color: #2E6EE1;
            background: #fff;
        }

        button {
            margin-top: 12px;
            padding: 9px 20px;
            background-color: #1553B6;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 13px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            width: 100%;
        }

        button:hover { background-color: #2E6EE1; }

        .hint {
            font-size: 11px;
            color: #A8C4E0;
            margin-top: 4px;
        }

        #batchIdResult {
            display: none;
            margin-top: 12px;
            padding: 10px 14px;
            background: #EBF2FF;
            border: 1px solid #D6E0EF;
            border-radius: 5px;
            font-size: 13px;
            color: #0B2D6E;
            font-weight: 600;
        }

        #productDetails { margin-top: 12px; font-size: 13px; color: #6B82A0; }
    </style>
</head>

<body>

    <header>
        <h1>Origin Pharm</h1>
        <p>Manufacturer Portal</p>
    </header>

    <div class="container">

        <!-- MINT BATCH -->
        <div class="section-label">Step 1 — Mint Batch</div>
        <div class="card">
            <h3>Mint New Pharmaceutical Batch</h3>
            <label for="medicineName">Medicine Name</label>
            <input type="text" id="medicineName" placeholder="e.g. Amoxicillin 500mg">
            <label for="batchSize">Batch Size / Reference</label>
            <input type="text" id="batchSize" placeholder="e.g. BATCH-001">
            <p class="hint">A unique Batch ID will be assigned on-chain when the batch is created</p>
            <label for="expiryDate">Expiry Date</label>
            <input type="date" id="expiryDate">
            <button onclick="mintBatch()">Create Batch</button>
            <div id="batchIdResult"></div>
        </div>

        <!-- RELEASE BATCH -->
        <div class="section-label">Step 2 — Release to Distributor</div>
        <div class="card">
            <h3>Release Batch</h3>
            <label for="releaseBatchId">Batch ID</label>
            <input type="number" id="releaseBatchId" placeholder="e.g. 1">
            <label for="distributorAddress">Distributor Wallet Address</label>
            <input type="text" id="distributorAddress" placeholder="0x...">
            <button onclick="releaseBatch()">Release Batch</button>
            <div id="productDetails"></div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/web3@1.3.6/dist/web3.min.js"></script>

    <script>
        var web3;

        if (typeof window.ethereum !== 'undefined') {
            web3 = new Web3(window.ethereum);
            window.ethereum.enable()
                .then(function (accounts) {
                    web3.eth.defaultAccount = accounts[0];
                    console.log("Default account set:", web3.eth.defaultAccount);
                    web3.eth.getAccounts()
                        .then(function (accounts) { console.log(accounts); })
                        .catch(function (error) { console.error(error); });
                })
                .catch(function (error) { console.error(error); });
        } else if (typeof window.web3 !== 'undefined') {
            web3 = new Web3(window.web3.currentProvider);
        } else {
            console.log('Non-Ethereum browser detected. Please install MetaMask.');
        }

        // ── UPDATE THESE ADDRESSES AFTER REMIX DEPLOYMENT ──────────────────
        const mintContractAddress    = 'PASTE_MINT_CONTRACT_ADDRESS_HERE';
        const controlContractAddress = 'PASTE_CONTROL_CONTRACT_ADDRESS_HERE';

        const mintContractABI = [
            {"inputs":[{"internalType":"string","name":"medicineName","type":"string"},{"internalType":"string","name":"batchNumber","type":"string"},{"internalType":"uint256","name":"expiryDate","type":"uint256"}],"name":"mintBatch","outputs":[{"internalType":"uint256","name":"batchId","type":"uint256"}],"stateMutability":"nonpayable","type":"function"},
            {"anonymous":false,"inputs":[{"indexed":true,"internalType":"uint256","name":"batchId","type":"uint256"},{"indexed":true,"internalType":"address","name":"manufacturer","type":"address"},{"indexed":false,"internalType":"string","name":"manufacturerName","type":"string"},{"indexed":false,"internalType":"string","name":"medicineName","type":"string"},{"indexed":false,"internalType":"string","name":"batchNumber","type":"string"},{"indexed":false,"internalType":"uint256","name":"expiryDate","type":"uint256"}],"name":"BatchMinted","type":"event"}
        ];

        const controlContractABI = [
            {"inputs":[{"internalType":"uint256","name":"batchId","type":"uint256"},{"internalType":"address","name":"distributor","type":"address"}],"name":"release","outputs":[],"stateMutability":"nonpayable","type":"function"}
        ];

        const mintContract    = new web3.eth.Contract(mintContractABI,    mintContractAddress);
        const controlContract = new web3.eth.Contract(controlContractABI, controlContractAddress);

        async function mintBatch() {
            const medicineName = document.getElementById('medicineName').value;
            const batchSize    = document.getElementById('batchSize').value;
            const expiryRaw    = document.getElementById('expiryDate').value;
            const expiryTs     = Math.floor(new Date(expiryRaw).getTime() / 1000);

            await mintContract.methods.mintBatch(medicineName, batchSize, expiryTs)
                .send({ from: web3.eth.defaultAccount })
                .on('transactionHash', function(hash) {
                    console.log('Transaction Hash:', hash);
                })
                .on('receipt', function(receipt) {
                    console.log('Receipt:', receipt);
                    // Read batchId from BatchMinted event
                    const event = receipt.events && receipt.events.BatchMinted;
                    if (event) {
                        const batchId = event.returnValues.batchId;
                        const resultDiv = document.getElementById('batchIdResult');
                        resultDiv.style.display = 'block';
                        resultDiv.textContent = 'Batch ID: ' + batchId + ' — record this and include it on the packing slip';
                        document.getElementById('releaseBatchId').value = batchId;
                    }
                })
                .catch(function(error) { console.error('Error minting batch:', error); });
        }

        async function releaseBatch() {
            const batchId     = document.getElementById('releaseBatchId').value;
            const distributor = document.getElementById('distributorAddress').value;

            await controlContract.methods.release(batchId, distributor)
                .send({ from: web3.eth.defaultAccount })
                .on('transactionHash', function(hash) {
                    console.log('Transaction Hash:', hash);
                })
                .on('confirmation', function(confirmationNumber, receipt) {
                    console.log('Confirmed:', receipt);
                })
                .catch(function(error) { console.error('Error releasing batch:', error); });

            document.getElementById('productDetails').textContent = 'Batch ' + batchId + ' released. Status → Released.';
        }
    </script>

</body>
</html>
