<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Origin Pharm (Consumer / Auditor)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #F0F4F8;
            color: #1A2E44;
            min-height: 100vh;
        }

        header {
            background-color: #0B2D6E;
            color: white;
            padding: 18px 24px;
            text-align: center;
        }

        header h1 { font-size: 22px; font-weight: 600; }
        header p  { font-size: 13px; color: #A8C4E0; margin-top: 4px; }

        .container {
            max-width: 720px;
            margin: 36px auto;
            padding: 0 20px 60px;
        }

        .section-label {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            color: #6B82A0;
            margin: 28px 0 10px;
        }

        .card {
            background: #FFFFFF;
            border: 1px solid #D6E0EF;
            border-radius: 8px;
            padding: 20px 22px;
            margin-bottom: 12px;
        }

        .card h3 {
            font-size: 14px;
            font-weight: 600;
            color: #0B2D6E;
            margin-bottom: 14px;
            padding-bottom: 10px;
            border-bottom: 1px solid #EAF0F8;
        }

        .info-note {
            background: #EBF2FF;
            border: 1px solid #D6E0EF;
            border-radius: 5px;
            padding: 12px 14px;
            font-size: 13px;
            color: #1553B6;
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            color: #6B82A0;
            margin-bottom: 4px;
            margin-top: 10px;
        }

        input[type="number"] {
            width: 100%;
            padding: 9px 11px;
            border: 1px solid #D6E0EF;
            border-radius: 5px;
            font-size: 13px;
            font-family: inherit;
            background: #F8FAFD;
            color: #1A2E44;
        }

        input:focus {
            outline: none;
            border-color: #2E6EE1;
            background: #fff;
        }

        button {
            margin-top: 12px;
            padding: 9px 20px;
            background-color: #1553B6;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 13px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            width: 100%;
        }

        button:hover { background-color: #2E6EE1; }

        #batchStatusResult {
            display: none;
            margin-top: 14px;
            padding: 16px;
            background: #F8FAFD;
            border: 1px solid #D6E0EF;
            border-radius: 6px;
        }

        #batchStatusResult p {
            font-size: 13px;
            color: #1A2E44;
            margin-bottom: 6px;
        }

        #batchStatusResult p strong { color: #0B2D6E; }

        .verified-yes {
            display: inline-block;
            background: #E6F5EE;
            color: #0A7A4C;
            border-radius: 12px;
            padding: 2px 10px;
            font-size: 12px;
            font-weight: 700;
        }

        .verified-no {
            display: inline-block;
            background: #FEF3C7;
            color: #B45309;
            border-radius: 12px;
            padding: 2px 10px;
            font-size: 12px;
            font-weight: 700;
        }

        .trail-item {
            background: #EBF2FF;
            border-radius: 5px;
            padding: 8px 10px;
            margin-bottom: 6px;
            font-size: 12px;
            color: #1A2E44;
        }
    </style>
</head>

<body>

    <header>
        <h1>Origin Pharm</h1>
        <p>Consumer / Regulatory Authority — Batch Verification</p>
    </header>

    <div class="container">

        <div class="info-note">
            Scan the QR code on your medication box to get the Batch ID, or enter it manually below to verify the medicine's authenticity and full supply chain history.
        </div>

        <div class="section-label">Verify Batch</div>
        <div class="card">
            <h3>Batch Status</h3>
            <label for="batchId">Batch ID</label>
            <input type="number" id="batchId" placeholder="Enter Batch ID from QR code">
            <button onclick="getBatchStatus()">Verify Batch</button>
            <div id="batchStatusResult"></div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/web3@1.3.6/dist/web3.min.js"></script>

    <script>
        var web3;

        if (typeof window.ethereum !== 'undefined') {
            web3 = new Web3(window.ethereum);
            window.ethereum.enable()
                .then(function (accounts) {
                    web3.eth.defaultAccount = accounts[0];
                    console.log("Default account set:", web3.eth.defaultAccount);
                    web3.eth.getAccounts()
                        .then(function (accounts) { console.log(accounts); })
                        .catch(function (error) { console.error(error); });
                })
                .catch(function (error) { console.error(error); });
        } else if (typeof window.web3 !== 'undefined') {
            web3 = new Web3(window.web3.currentProvider);
        } else {
            console.log('Non-Ethereum browser detected. Please install MetaMask.');
        }

        // ── UPDATE THIS ADDRESS AFTER REMIX DEPLOYMENT ──────────────────────
        const verificationContractAddress = 'PASTE_VERIFICATION_CONTRACT_ADDRESS_HERE';

        const verificationContractABI = [
            {"inputs":[{"internalType":"uint256","name":"batchId","type":"uint256"}],"name":"batchStatus","outputs":[{"internalType":"string","name":"medicineName","type":"string"},{"internalType":"string","name":"batchNumber","type":"string"},{"internalType":"string","name":"manufacturerName","type":"string"},{"internalType":"address","name":"manufacturer","type":"address"},{"internalType":"uint256","name":"manufactureDate","type":"uint256"},{"internalType":"uint256","name":"expiryDate","type":"uint256"},{"internalType":"string","name":"status","type":"string"},{"internalType":"bool","name":"verified","type":"bool"},{"internalType":"address","name":"currentOwner","type":"address"},{"components":[{"internalType":"address","name":"from","type":"address"},{"internalType":"address","name":"to","type":"address"},{"internalType":"uint8","name":"status","type":"uint8"},{"internalType":"uint256","name":"timestamp","type":"uint256"},{"internalType":"string","name":"notes","type":"string"}],"internalType":"struct CustodyRecord[]","name":"custodyTrail","type":"tuple[]"}],"stateMutability":"view","type":"function"}
        ];

        const verificationContract = new web3.eth.Contract(verificationContractABI, verificationContractAddress);

        const statusLabels = ['Produced', 'Released', 'InTransit', 'Received'];

        async function getBatchStatus() {
            const batchId = document.getElementById('batchId').value;

            const result = await verificationContract.methods.batchStatus(batchId).call();

            const medicineName     = result[0];
            const batchNumber      = result[1];
            const manufacturerName = result[2];
            const manufacturer     = result[3];
            const manufactureDate  = new Date(result[4] * 1000).toLocaleDateString('en-AU');
            const expiryDate       = new Date(result[5] * 1000).toLocaleDateString('en-AU');
            const status           = result[6];
            const verified         = result[7];
            const currentOwner     = result[8];
            const custodyTrail     = result[9];

            const verifiedBadge = verified
                ? '<span class="verified-yes">✓ Verified</span>'
                : '<span class="verified-no">⏳ Not Yet Verified</span>';

            let trailHTML = '';
            custodyTrail.forEach(function(rec, i) {
                const recStatus = statusLabels[rec.status] || rec.status;
                const ts = new Date(rec.timestamp * 1000).toLocaleDateString('en-AU');
                trailHTML += `<div class="trail-item"><strong>${i+1}. ${recStatus}</strong> — ${rec.from.slice(0,6)}...${rec.from.slice(-4)} → ${rec.to.slice(0,6)}...${rec.to.slice(-4)} &nbsp;·&nbsp; ${ts}${rec.notes ? ' · ' + rec.notes : ''}</div>`;
            });

            const resultDiv = document.getElementById('batchStatusResult');
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = `
                <p><strong>Medicine:</strong> ${medicineName}</p>
                <p><strong>Batch Reference:</strong> ${batchNumber}</p>
                <p><strong>Manufacturer:</strong> ${manufacturerName}</p>
                <p><strong>Manufacturer Address:</strong> ${manufacturer}</p>
                <p><strong>Manufacture Date:</strong> ${manufactureDate}</p>
                <p><strong>Expiry Date:</strong> ${expiryDate}</p>
                <p><strong>Status:</strong> ${status}</p>
                <p><strong>Verified:</strong> ${verifiedBadge}</p>
                <p><strong>Current Custodian:</strong> ${currentOwner}</p>
                <p style="margin-top:10px;margin-bottom:6px;font-weight:600;font-size:12px;color:#6B82A0;text-transform:uppercase;letter-spacing:0.8px;">Custody Trail</p>
                ${trailHTML || '<div class="trail-item">No transfers recorded yet.</div>'}
            `;
        }

        // Auto-load if batchId passed in URL e.g. Consumer.html?batch=1
        window.addEventListener('load', function() {
            var params  = new URLSearchParams(window.location.search);
            var batchId = params.get('batch');
            if (batchId) {
                document.getElementById('batchId').value = batchId;
                getBatchStatus();
            }
        });
    </script>

</body>
</html>
